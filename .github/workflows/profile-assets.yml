name: Update Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"    # once a day at midnight UTC
  workflow_dispatch:         # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      # ---- Main stats card (self-hosted: commits assets/metrics.svg into this repo) ----
      - name: Generate main metrics card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRIC_TOKEN }}
          filename: assets/metrics.svg
          template: classic
          base: "header, activity, community, repositories, metadata"

      # ---- Top languages card ----
      - name: Generate languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRIC_TOKEN }}
          filename: assets/languages.svg
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_threshold: 2%

      # ---- Achievements card (replaces the old "trophies" widget) ----
      - name: Generate achievements card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRIC_TOKEN }}
          filename: assets/achievements.svg
          template: classic
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C

      # ---- Isometric contribution calendar (replaces the activity-graph widget) ----
      - name: Generate contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRIC_TOKEN }}
          filename: assets/calendar.svg
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ---- Snake contribution graph ----
      # Checkout happens here (after the metrics commits above) so this step
      # starts from the latest commit and doesn't conflict with them.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg
            assets/snake-dark.svg?palette=github-dark

      - name: Commit snake graph to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update snake contribution graph"
          file_pattern: "assets/snake.svg assets/snake-dark.svg"
