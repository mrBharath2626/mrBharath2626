<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#151a2e"/>
      <stop offset="100%" stop-color="#1e2243"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2EA3F7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>

  <!-- subtle circuit-style grid dots -->
  <g fill="#2EA3F7" opacity="0.15">
    <circle cx="60" cy="40" r="2"/><circle cx="120" cy="40" r="2"/><circle cx="180" cy="40" r="2"/>
    <circle cx="60" cy="180" r="2"/><circle cx="120" cy="180" r="2"/><circle cx="180" cy="180" r="2"/>
    <circle cx="1020" cy="40" r="2"/><circle cx="1080" cy="40" r="2"/><circle cx="1140" cy="40" r="2"/>
    <circle cx="1020" cy="180" r="2"/><circle cx="1080" cy="180" r="2"/><circle cx="1140" cy="180" r="2"/>
  </g>
  <g stroke="#2EA3F7" stroke-width="1" opacity="0.12">
    <line x1="60" y1="40" x2="120" y2="40"/>
    <line x1="120" y1="40" x2="120" y2="90"/>
    <line x1="1080" y1="180" x2="1080" y2="130"/>
    <line x1="1080" y1="130" x2="1140" y2="130"/>
  </g>

  <!-- angle bracket accents -->
  <text x="90" y="140" font-family="Consolas, Menlo, monospace" font-size="46" fill="#2EA3F7" opacity="0.35">&lt;/&gt;</text>
  <text x="990" y="140" font-family="Consolas, Menlo, monospace" font-size="46" fill="#7c3aed" opacity="0.35">{ }</text>

  <text x="600" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff" text-anchor="middle">
    Hey, I'm Bharath S
  </text>
  <text x="600" y="150" font-family="Consolas, Menlo, monospace" font-size="20" fill="url(#accent)" text-anchor="middle">
    AI &amp; Data Science Engineer · Full-Stack · Cloud
  </text>
</svg>
